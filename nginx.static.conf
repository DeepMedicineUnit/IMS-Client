server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets with caching
    location ~* \.(?:css|js|map|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri /index.html;
    }

    # React app routes
    location / {
        try_files $uri /index.html;
    }
}