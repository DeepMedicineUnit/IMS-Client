server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Canonical status address: remove the duplicate SPA page.
    location = /status { absolute_redirect off; return 301 /; }
    location = /status/ { absolute_redirect off; return 301 /; }


    # Proxy API requests to status module
    location /api/ {
        proxy_pass http://status:5009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Static assets with caching
    location ~* \.(?:css|js|map|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri /index.html;
    }

    # React app routes
    location / {
        try_files $uri /index.html;
    }
}
